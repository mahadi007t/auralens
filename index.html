<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AuraLens – Free photos from photographers worldwide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{--bg:#050505;--surface:#111;--line:#2a2418;--text:#f3ecdc;--muted:#a79f8d;--gold:#d4a84b;--gold2:#f0cf7a;--ong:#120d00;--err:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.94);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;display:flex;gap:8px;align-items:center}
.logo b{color:var(--gold);font-weight:600}
.btns{display:flex;gap:8px;align-items:center}
button,.btn{font:inherit;cursor:pointer}
.btn{padding:8px 15px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--gold2);font-weight:600;font-size:14px}
.btn.fill{background:var(--gold);color:var(--ong)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
.hero{padding:44px 0 28px}
.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.04;max-width:13ch;margin-bottom:12px}
.hero p{color:var(--muted);max-width:44ch;margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;background:#0a0a0a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
input:focus{border-color:var(--gold);outline:none}
.msg{min-height:20px;font-size:13px;margin:10px 0 0;color:var(--err)}
.msg.ok{color:var(--gold2)}
.sw{font-size:13px;color:var(--muted);margin-top:14px}
.sw a{color:var(--gold2);text-decoration:underline;cursor:pointer}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.tools input{flex:1;min-width:180px}
.tools select{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:50px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#1a1a1a}
.meta{padding:9px 11px;font-size:13px}
.meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--muted);font-size:12px}
.act{display:flex;gap:8px;margin-top:8px}
.act button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--gold2);font-size:12px}
.act .del{color:var(--err)}
.empty{color:var(--muted);padding:30px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal.on{display:flex}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="/">◎ Aura<b>Lens</b></a>
  <div class="btns" id="nav"></div>
</div></header>

<main class="wrap">
  <!-- Logged out -->
  <section id="guest" class="hero">
    <h1>Free photos. Real photographers.</h1>
    <p>Join AuraLens to download high-quality photos and share your own work with the world.</p>
    <div class="card">
      <h2 id="atitle" style="font-size:28px">Log in</h2>
      <label for="em">Email</label><input id="em" type="email" autocomplete="email">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <p class="msg" id="amsg" role="status"></p>
      <button class="btn fill" id="abtn" style="width:100%;margin-top:6px;padding:12px">Log in</button>
      <p class="sw" id="asw">New here? <a id="toggle">Create an account</a></p>
    </div>
  </section>

  <!-- Logged in -->
  <section id="app" class="hide">
    <div class="tools" style="padding-top:18px">
      <input id="q" type="search" placeholder="Search photos…" aria-label="Search photos">
      <select id="cf" aria-label="Category"><option value="">All categories</option></select>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty hide" id="empty">No photos yet. Be the first to upload one!</p>
  </section>
</main>

<div class="modal" id="up" role="dialog" aria-label="Upload photo">
  <div class="card" style="width:100%">
    <h2 style="font-size:28px">Upload a photo</h2>
    <label for="file">Photo (JPG/PNG/WebP, max 5 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp">
    <label for="title">Title</label><input id="title" maxlength="80">
    <label for="cat">Category</label><select id="cat"></select>
    <p class="msg" id="umsg" role="status"></p>
    <div class="btns" style="margin-top:8px"><button class="btn fill" id="ubtn">Upload</button><button class="btn" id="ucancel">Cancel</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://tbbcunskxuovcaojyxga.supabase.co";
const SB_KEY="sb_publishable_mC60n3E4carUavGb-XmEEg_zlGT7wwG";
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=["Nature","Wildlife","Travel","Portrait","Street","Architecture","Aerial","Other"];
const $=id=>document.getElementById(id);
let user=null,photos=[],mode="login";

CATS.forEach(c=>{$("cf").add(new Option(c,c));$("cat").add(new Option(c,c))});

function setMsg(el,t,ok){el.textContent=t;el.className="msg"+(ok?" ok":"")}
function nav(){
  const n=$("nav");n.innerHTML="";
  const mk=(t,cls,fn)=>{const b=document.createElement("button");b.className="btn "+cls;b.textContent=t;b.onclick=fn;n.appendChild(b)};
  if(user){mk("Upload","fill",()=>{$("up").classList.add("on")});mk("Log out","",()=>sb.auth.signOut())}
}
function render(){
  nav();
  $("guest").classList.toggle("hide",!!user);
  $("app").classList.toggle("hide",!user);
  if(user)load();
}
function setMode(m){
  mode=m;const li=m==="login";
  $("atitle").textContent=li?"Log in":"Sign up";
  $("abtn").textContent=li?"Log in":"Create account";
  $("pw").autocomplete=li?"current-password":"new-password";
  $("asw").innerHTML=li?'New here? <a id="toggle">Create an account</a>':'Already have an account? <a id="toggle">Log in</a>';
  $("toggle").onclick=()=>setMode(li?"signup":"login");
  setMsg($("amsg"),"");
}
$("toggle").onclick=()=>setMode("signup");

$("abtn").onclick=async()=>{
  const email=$("em").value.trim(),password=$("pw").value;
  if(!email||password.length<6){setMsg($("amsg"),"Enter a valid email and a password of 6+ characters.");return}
  $("abtn").disabled=true;setMsg($("amsg"),"Please wait…",true);
  const r=mode==="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  $("abtn").disabled=false;
  if(r.error){setMsg($("amsg"),r.error.message);return}
  if(mode==="signup"&&!r.data.session)setMsg($("amsg"),"Account created. Check your email to confirm, then log in.",true);
  else setMsg($("amsg"),"");
};

async function load(){
  const {data,error}=await sb.from("photos").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);return}
  photos=data||[];draw();
}
function url(p){return sb.storage.from("photos").getPublicUrl(p).data.publicUrl}
function draw(){
  const q=$("q").value.toLowerCase(),c=$("cf").value,g=$("grid");
  g.innerHTML="";
  const list=photos.filter(p=>(!c||p.category===c)&&(!q||p.title.toLowerCase().includes(q)));
  $("empty").classList.toggle("hide",list.length>0);
  list.forEach(p=>{
    const d=document.createElement("div");d.className="ph";
    const im=document.createElement("img");im.loading="lazy";im.src=url(p.path);im.alt=p.title;
    const m=document.createElement("div");m.className="meta";
    const s=document.createElement("strong");s.textContent=p.title;
    const sp=document.createElement("span");sp.textContent=p.category||"";
    const a=document.createElement("div");a.className="act";
    const dl=document.createElement("button");dl.textContent="Download";dl.onclick=()=>download(p);
    a.appendChild(dl);
    if(user&&p.user_id===user.id){const x=document.createElement("button");x.className="del";x.textContent="Delete";x.onclick=()=>del(p);a.appendChild(x)}
    m.append(s,sp,a);d.append(im,m);g.appendChild(d);
  });
}
$("q").oninput=draw;$("cf").onchange=draw;

async function download(p){
  try{
    const b=await (await fetch(url(p.path))).blob();
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download=p.title.replace(/[^\w\-]+/g,"_")+"."+(p.path.split(".").pop()||"jpg");
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){window.open(url(p.path),"_blank")}
}
async function del(p){
  if(!confirm("Delete this photo?"))return;
  await sb.storage.from("photos").remove([p.path]);
  const {error}=await sb.from("photos").delete().eq("id",p.id);
  if(!error)load();
}

$("ucancel").onclick=()=>$("up").classList.remove("on");
$("ubtn").onclick=async()=>{
  const f=$("file").files[0],t=$("title").value.trim();
  if(!f){setMsg($("umsg"),"Choose a photo first.");return}
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){setMsg($("umsg"),"Only JPG, PNG or WebP.");return}
  if(f.size>5*1024*1024){setMsg($("umsg"),"File is larger than 5 MB.");return}
  if(!t){setMsg($("umsg"),"Add a title.");return}
  $("ubtn").disabled=true;setMsg($("umsg"),"Uploading…",true);
  const ext=f.type.split("/")[1].replace("jpeg","jpg");
  const path=user.id+"/"+Date.now()+"."+ext;
  const u=await sb.storage.from("photos").upload(path,f,{contentType:f.type});
  if(u.error){$("ubtn").disabled=false;setMsg($("umsg"),u.error.message);return}
  const r=await sb.from("photos").insert({title:t,category:$("cat").value,path});
  $("ubtn").disabled=false;
  if(r.error){setMsg($("umsg"),r.error.message);return}
  $("file").value="";$("title").value="";setMsg($("umsg"),"");
  $("up").classList.remove("on");load();
};

sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;render()});
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;render()});
</script>
</body>
</html>
